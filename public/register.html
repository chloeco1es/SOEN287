<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign Up | DashWise</title>

        <!-- connect to Google Fonts early so the fonts load faster -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Bricolage Grotesque (headings), DM Sans (body), Sansita Italic (logo) -->
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:wght@400;600&family=Sansita:ital,wght@1,800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <a href="index.html" class="logo logo-md">DashWise</a>
            <nav>
                <a href="login.html" class="button">Log In</a>
            </nav>
        </header>
        <main>
            <section class="auth">
                <h1>Create your account</h1>

                <form id="register-form" class="auth-form" action="/register" method="post">
                    <!-- error messages appear here -->
                    <p id="form-error" class="form-error" role="alert"></p>

                    <div class="field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                        <small class="tip">How DashWise will refer to you - can be a first name only.</small>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
                        <small class="tip">At least 8 characters.</small>
                    </div>

                    <div class="field">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" required minlength="8">
                    </div>

                    <button type="submit" class="button button-md">Sign Up</button>
                </form>

                <p>Already have an account? <a href="login.html" class="button button-sm">Log in</a></p>
            </section>
        </main>
        <footer>
            <span class="logo logo-sm">DashWise</span>
            <p>© 2026 DashWise</p>
            <p>Made by Chloe Coles for SOEN 287 Q 2262 - Fall 2026 - Dr. Yuhong Yan</p>
        </footer>
    </body>
</html>
