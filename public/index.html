<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DashWise</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <div class="brand">
                <h1>DashWise</h1>
                <p>Today's assignments, at a glance.</p>
            </div>
            <nav>
                <button>Log In</button>
                <button>Sign Up</button>
            </nav>
        </header>
        <main>
            <h1>Today's assignments, at a glance.</h1>
            <p>One sentence pitch</p>
            <button>Get Started</button>
            <section>
                <div class="cards">
                    <article class="card">
                        <p>First feature: seeing today's tasks at a glance</p>
                    </article>
                    <article class="card">
                        <p>Second feature: choosing task deadlines or not</p>
                    </article>
                    <article class="card">
                        <p>Third feature: daily count of tasks checked off</p>
                    </article>
                </div>
            </section>
        </main>
        <footer>This is the footer</footer>
        <script src="js/main.js"></script>
    </body>
</html>
