<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard | DashWise</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:wght@400;600&family=Sansita:ital,wght@1,800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>
        <header>
            <a href="/dashboard" class="logo logo-md">DashWise</a>
            <nav>
                <form action="/logout" method="post">
                    <button type="submit" class="button">Log Out</button>
                </form>
            </nav>
        </header>
        <main>
            <h1>Your dashboard</h1>

            <div class="dashboard">
                <!-- right column on wide screens, top of the page on phones -->
                <div class="sidebar">
                    <!-- progress numbers; dashboard.js fills these in -->
                    <section class="panel stats" aria-live="polite">
                        <h2>Today</h2>
                        <p><strong id="done-today">0</strong> checked off today</p>
                        <p><strong id="tasks-left">0</strong> still to do</p>
                    </section>

                    <!-- form for adding a new task -->
                    <section class="panel">
                        <h2>Add a task</h2>
                        <form id="task-form" class="task-form" novalidate>
                            <div id="form-error" class="form-error" role="alert"></div> <!-- error messages appear here -->

                            <div class="field">
                                <label for="title">Task</label>
                                <input type="text" id="title" name="title" maxlength="100" required>
                            </div>

                            <div class="field">
                                <label for="dueDate">Due <span class="tip">(optional)</span></label>
                                <input type="date" id="dueDate" name="dueDate">
                            </div>

                            <div class="field">
                                <label for="list">List <span class="tip">(optional)</span></label>
                                <input type="text" id="list" name="list" maxlength="50" list="list-options" autocomplete="off">
                                <datalist id="list-options"></datalist> <!-- dashboard.js fills this with lists you've already used -->
                            </div>

                            <button type="submit" class="button">Add Task</button>
                        </form>
                    </section>
                </div>

                <!-- left column on wide screens; the user's tasks get added inside the <ul> by dashboard.js -->
                <section class="panel tasks-panel">
                    <h2>Your tasks</h2>
                    <div id="list-error" class="form-error" role="alert"></div>
                    <p id="empty-message">No tasks yet. Add one with the form!</p>
                    <div id="task-groups"></div> <!-- dashboard.js adds a heading + list for each of the user's lists -->
                </section>
            </div>
        </main>
        <footer>
            <span class="logo logo-sm">DashWise</span>
            <p>© 2026 DashWise</p>
            <p>Made by Chloe Coles for SOEN 287 Q 2262 - Fall 2026 - Dr. Yuhong Yan</p>
        </footer>
        <script src="/js/dashboard.js"></script>
    </body>
</html>
